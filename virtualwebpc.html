<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Virtual PC</title>
<style>
/* ─────────────────────────── tokens ─────────────────────────── */
:root{
  --ink:#0f1317;
  --panel:#141a20;
  --panel-2:#19212a;
  --raise:#1e2731;
  --line:#232c35;
  --line-soft:#1b232b;
  --text:#d7dee6;
  --muted:#8794a3;
  --faint:#5d6b7a;
  --accent:#dfa32e;
  --accent-dim:rgba(223,163,46,.14);
  --danger:#e0685f;

  --t-comment:#5d6b7a;
  --t-string:#9dcb8a;
  --t-number:#e0a26a;
  --t-keyword:#c58af9;
  --t-type:#6fb3f0;
  --t-fn:#dfa32e;
  --t-tag:#6fb3f0;
  --t-attr:#c58af9;

  --sans:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace;

  --sw:270px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{
  background:var(--ink);color:var(--text);
  font:13px/1.5 var(--sans);
  display:flex;flex-direction:column;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
::selection{background:rgba(223,163,46,.28)}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* scrollbars */
*::-webkit-scrollbar{width:11px;height:11px}
*::-webkit-scrollbar-thumb{background:#2a343f;border:3px solid transparent;background-clip:content-box;border-radius:8px}
*::-webkit-scrollbar-thumb:hover{background:#3a4855;background-clip:content-box}
*::-webkit-scrollbar-track{background:transparent}

/* ─────────────────────────── header ─────────────────────────── */
.appbar{
  height:46px;flex:0 0 46px;display:flex;align-items:center;gap:10px;
  padding:0 12px;background:var(--panel);border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;letter-spacing:.2px}
.brand b{font-weight:600}
.brand i{
  width:9px;height:9px;border-radius:2px;background:var(--accent);
  display:inline-block;transform:rotate(45deg);font-style:normal;
}
.appbar .grow{flex:1}
.icon-btn{
  width:30px;height:30px;display:grid;place-items:center;border-radius:6px;color:var(--muted);
}
.icon-btn:hover{background:var(--raise);color:var(--text)}
.btn{
  height:30px;padding:0 12px;border-radius:6px;border:1px solid var(--line);
  color:var(--text);background:var(--panel-2);
}
.btn:hover{background:var(--raise);border-color:#31404d}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.ghost:hover{background:var(--raise);color:var(--text)}
.btn.primary{background:var(--accent);color:#20180a;border-color:var(--accent);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--danger);border-color:#3a2a2a}
.btn.danger:hover{background:rgba(224,104,95,.12)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.sep{width:1px;height:20px;background:var(--line)}

/* ─────────────────────────── shell ─────────────────────────── */
main{flex:1;display:flex;min-height:0}
aside{
  width:var(--sw);flex:0 0 var(--sw);min-width:0;
  background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0;
}
body.nav-closed aside,body.nav-closed .grip{display:none}
.grip{flex:0 0 5px;margin-left:-3px;cursor:col-resize;z-index:5;background:transparent}
.grip:hover,.grip.active{background:var(--accent-dim)}

.nav-tools{padding:9px 9px 7px;display:flex;gap:6px;border-bottom:1px solid var(--line-soft)}
.search{
  flex:1;min-width:0;height:28px;padding:0 9px;border-radius:6px;
  background:var(--ink);border:1px solid var(--line);
}
.search::placeholder{color:var(--faint)}
.search:focus{border-color:#31404d;outline:none}
.mini{
  height:28px;width:28px;display:grid;place-items:center;border-radius:6px;
  border:1px solid var(--line);background:var(--panel-2);color:var(--muted);
}
.mini:hover{background:var(--raise);color:var(--text)}

.tree{flex:1;overflow:auto;padding:6px 6px 24px}
.children{margin-left:10px;padding-left:9px;border-left:1px solid var(--line-soft)}
.row{
  display:flex;align-items:center;gap:6px;height:26px;padding:0 6px;border-radius:5px;
  cursor:default;user-select:none;color:var(--text);
}
.row:hover{background:var(--panel-2)}
.row.active{background:var(--accent-dim);box-shadow:inset 2px 0 0 var(--accent)}
.row.active .label{color:#f2d9a8}
.row .tw{
  width:14px;height:14px;flex:0 0 14px;display:grid;place-items:center;color:var(--faint);
  transition:transform .12s ease;
}
.row .tw.open{transform:rotate(90deg)}
.row .tw.leaf{visibility:hidden}
.row .gl{width:15px;flex:0 0 15px;display:grid;place-items:center;color:var(--muted)}
.row.active .gl{color:var(--accent)}
.row .label{
  flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.row .label[contenteditable="true"]{
  background:var(--ink);border:1px solid var(--accent);border-radius:4px;
  padding:1px 4px;margin:-2px 0;outline:none;text-overflow:clip;
}
.row.dragging{opacity:.4}
.row.into{background:var(--accent-dim);box-shadow:inset 0 0 0 1px var(--accent)}
.row.before{box-shadow:inset 0 2px 0 var(--accent)}
.row.after{box-shadow:inset 0 -2px 0 var(--accent)}
.tree.rootdrop{background:rgba(223,163,46,.05)}
.nav-foot{
  flex:0 0 auto;padding:7px 12px;border-top:1px solid var(--line-soft);
  color:var(--faint);font-size:11.5px;display:flex;justify-content:space-between;
}
.nav-empty{padding:22px 14px;color:var(--faint);line-height:1.7}

/* ─────────────────────────── content ─────────────────────────── */
#content{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
.doc-bar{
  flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:9px 18px;
  border-bottom:1px solid var(--line);background:var(--panel);
}
.crumbs{color:var(--faint);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 0 auto;max-width:32%}
#docTitle{
  flex:1;min-width:0;background:none;border:1px solid transparent;border-radius:6px;
  font:600 15px/1.4 var(--sans);padding:4px 8px;
}
#docTitle:hover{border-color:var(--line)}
#docTitle:focus{border-color:#31404d;background:var(--ink);outline:none}
.status{color:var(--faint);font-size:11.5px;min-width:46px;text-align:right}
.status.on{color:var(--accent)}

.toolbar{
  flex:0 0 auto;display:flex;align-items:center;gap:3px;flex-wrap:wrap;
  padding:6px 14px;border-bottom:1px solid var(--line);background:var(--panel-2);
}
.toolbar button{
  height:27px;min-width:29px;padding:0 8px;border-radius:5px;color:var(--muted);
  display:inline-flex;align-items:center;justify-content:center;
}
.toolbar button:hover{background:var(--raise);color:var(--text)}
.toolbar .lang{
  height:27px;border-radius:5px;background:var(--ink);border:1px solid var(--line);
  padding:0 6px;color:var(--muted);
}
.tb-sep{width:1px;height:18px;background:var(--line);margin:0 5px}
.tb-hint{margin-left:auto;color:var(--faint);font-size:11.5px}

.scroll{flex:1;overflow:auto;min-height:0}
.page{max-width:900px;margin:0 auto;padding:34px 40px 120px;position:relative}
#source{
  width:100%;height:100%;min-height:100%;resize:none;border:0;outline:none;
  background:var(--ink);color:#b9c4d0;font:12.5px/1.7 var(--mono);padding:22px 26px;
}
.empty{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;color:var(--faint);text-align:center;
}
.empty h2{font:400 20px/1.4 var(--serif);color:var(--muted);margin:0}

/* article typography */
.body{
  font:16.5px/1.72 var(--serif);color:#dfe5ec;
  outline:none;word-wrap:break-word;
}
.body[contenteditable="true"]{caret-color:var(--accent);min-height:58vh}
.body>*:first-child{margin-top:0}
.body h1,.body h2,.body h3,.body h4{
  font-family:var(--sans);color:#f0f4f8;line-height:1.3;letter-spacing:-.01em;
  margin:1.9em 0 .5em;
}
.body h1{font-size:27px;font-weight:600}
.body h2{font-size:21px;font-weight:600}
.body h3{font-size:17px;font-weight:600}
.body h4{font-size:15px;font-weight:600;color:var(--muted)}
.body p{margin:0 0 1.05em}
/* keep typed tabs (Tab key) visible instead of collapsing them to one space */
.body p,.body h1,.body h2,.body h3,.body h4,.body li,.body blockquote,.body td,.body th{white-space:pre-wrap;tab-size:4}
.body ul,.body ol{margin:0 0 1.05em;padding-left:1.35em}
.body li{margin:.28em 0}
.body li::marker{color:var(--accent)}
.body a{color:#79b8ff;text-decoration:underline;text-underline-offset:2px}
.body blockquote{
  margin:1.2em 0;padding:.1em 0 .1em 1.1em;border-left:2px solid var(--accent);
  color:var(--muted);font-style:italic;
}
.body hr{border:0;border-top:1px solid var(--line);margin:2em 0}
.body code{
  font:.84em/1.5 var(--mono);background:var(--panel-2);border:1px solid var(--line-soft);
  border-radius:4px;padding:.1em .35em;color:#e6c07b;
}
.body table{border-collapse:collapse;width:100%;margin:1.2em 0;font:14px/1.5 var(--sans)}
.body th,.body td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
.body th{background:var(--panel-2);font-weight:600}
.body img{max-width:100%;border-radius:6px}

/* code blocks — allowed to bleed past the reading column */
.body pre.code{
  margin:1.4em 0;padding:14px 16px;border:1px solid var(--line);border-radius:8px;
  background:#0b0e12;color:#c3ccd6;font:12.9px/1.65 var(--mono);
  white-space:pre-wrap;overflow-x:auto;tab-size:2;
}
.code-wrap{margin:1.4em 0;position:relative}
.code-wrap pre.code{margin:0}
.code-bar{
  display:flex;align-items:center;gap:6px;
  padding:0 4px 5px;color:var(--faint);font:11.5px/1 var(--sans);
}
.code-bar button{color:var(--faint);padding:2px 6px;border-radius:4px}
.code-bar button:hover{color:var(--text);background:var(--raise)}
.code-bar .tog{display:grid;place-items:center;width:20px;height:20px;padding:0}
.code-bar .tog svg{transform:rotate(180deg);transition:transform .12s ease}
.code-bar .n{flex:1;opacity:.75}
/* collapsed (the default on every render): only the bar shows, the chevron points down */
.code-wrap.collapsed .code-bar{padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:#0b0e12}
.code-wrap.collapsed .tog svg{transform:none}
.code-wrap.collapsed pre.code{display:none}
.body[contenteditable="true"] pre.code{
  border-color:#2f3a46;border-left:2px solid var(--accent);
  padding-top:40px;                    /* reserved strip for the header */
}
#blocks{position:absolute;inset:0;pointer-events:none;z-index:3}
.blk{
  position:absolute;height:31px;display:flex;align-items:center;gap:6px;
  padding:0 5px 0 8px;background:#131a22;border-bottom:1px solid var(--line);
  border-radius:7px 7px 0 0;pointer-events:auto;
}
.blk select{
  height:23px;max-width:62%;padding:0 4px;border-radius:4px;
  background:var(--ink);border:1px solid var(--line);color:var(--muted);
  font:11.5px var(--sans);cursor:pointer;
}
.blk select:hover{color:var(--text);border-color:#31404d}
.blk .grow{flex:1}
.blk .fmt{
  height:23px;padding:0 8px;border-radius:4px;
  border:1px solid var(--line);color:var(--muted);font:11.5px var(--sans);
}
.blk .fmt:hover{color:var(--text);border-color:#31404d;background:var(--raise)}
.blk .x{width:23px;height:23px;display:grid;place-items:center;border-radius:4px;color:var(--faint)}
.blk .x:hover{background:rgba(224,104,95,.14);color:var(--danger)}
/* tables — while editing, a strip above the active table holds the row/column tools */
.body[contenteditable="true"] table{margin-top:46px}
.body[contenteditable="true"] td:empty::after,.body[contenteditable="true"] th:empty::after{content:"\200B"}
.tbl{
  position:absolute;height:28px;display:flex;align-items:center;gap:2px;z-index:3;
  padding:0 4px;background:#131a22;border:1px solid var(--line);border-radius:6px;
  font:11.5px var(--sans);color:var(--muted);white-space:nowrap;
}
.tbl button{height:22px;padding:0 7px;border-radius:4px;color:var(--muted);display:inline-flex;align-items:center}
.tbl button:hover{background:var(--raise);color:var(--text)}
.tbl .sep{width:1px;height:14px;background:var(--line);margin:0 3px}
.tbl .x{width:23px;padding:0;justify-content:center;color:var(--faint)}
.tbl .x:hover{background:rgba(224,104,95,.14);color:var(--danger)}
.t-comment{color:var(--t-comment);font-style:italic}
.t-string{color:var(--t-string)}
.t-number{color:var(--t-number)}
.t-keyword{color:var(--t-keyword)}
.t-type{color:var(--t-type)}
.t-fn{color:var(--t-fn)}
.t-tag{color:var(--t-tag)}
.t-attr{color:var(--t-attr)}

/* ─────────────────────────── overlays ─────────────────────────── */
.menu{
  position:fixed;z-index:60;min-width:172px;padding:5px;border-radius:8px;
  background:var(--panel-2);border:1px solid var(--line);
  box-shadow:0 14px 34px rgba(0,0,0,.55);display:none;
}
.menu.open{display:block}
.menu button{
  display:flex;width:100%;align-items:center;gap:9px;padding:6px 9px;border-radius:5px;
  color:var(--text);text-align:left;
}
.menu button:hover{background:var(--raise)}
.menu button.danger{color:var(--danger)}
.menu .div{height:1px;background:var(--line);margin:4px 2px}

.veil{
  position:fixed;inset:0;z-index:80;background:rgba(6,9,12,.66);
  display:none;align-items:center;justify-content:center;
}
.veil.open{display:flex}
.dialog{
  width:400px;max-width:calc(100vw - 40px);background:var(--panel);
  border:1px solid var(--line);border-radius:10px;padding:20px;
  box-shadow:0 22px 60px rgba(0,0,0,.6);
}
.dialog h3{margin:0 0 8px;font:600 15px/1.4 var(--sans)}
.dialog p{margin:0 0 16px;color:var(--muted);line-height:1.6}
.dialog input{
  width:100%;height:34px;padding:0 10px;border-radius:6px;
  background:var(--ink);border:1px solid var(--line);margin-bottom:16px;
}
.dialog input:focus{border-color:var(--accent);outline:none}
.dialog .acts{display:flex;justify-content:flex-end;gap:8px}
.dialog.wide{width:520px}
.pick-head{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  margin-bottom:8px;font-size:12px;color:var(--muted)
}
.pick-head .btn{height:26px;padding:0 10px;font-size:12px}
.pick-tree{
  max-height:min(50vh,380px);overflow:auto;border:1px solid var(--line);border-radius:6px;
  background:var(--ink);padding:4px;margin-bottom:16px;
}
.pick-row{display:flex;align-items:center;gap:6px;height:28px;padding:0 6px;border-radius:5px;cursor:pointer;user-select:none}
.pick-row:hover{background:var(--panel-2)}
.pick-tree.ro .pick-row{cursor:default}
.pick-tree.ro .pick-row:hover{background:none}
.pick-row input{width:14px;height:14px;margin:0;accent-color:var(--accent);cursor:pointer;flex:none}
.pick-row .gl{display:inline-flex;width:16px;flex:none;color:var(--muted)}
.pick-row .gl svg{width:14px;height:14px}
.pick-row .label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}

#toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);z-index:90;
  padding:9px 16px;border-radius:7px;background:var(--panel-2);border:1px solid var(--line);
  box-shadow:0 10px 30px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:.18s ease;
}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="appbar">
  <button class="icon-btn" id="btnNav" title="Toggle sidebar  (Ctrl+\)" aria-label="Toggle sidebar">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4">
      <rect x="1.5" y="2.5" width="13" height="11" rx="1.5"/><line x1="6" y1="2.5" x2="6" y2="13.5"/>
    </svg>
  </button>
  <div class="brand"><i></i><b>Virtual PC</b></div>
  <div class="grow"></div>
  <button class="btn ghost" id="btnImport">Import</button>
  <button class="btn" id="btnExport">Export</button>
  <input type="file" id="file" accept="application/json,.json" hidden>
</header>

<main>
  <aside>
    <div class="nav-tools">
      <input class="search" id="search" placeholder="Search pages" spellcheck="false">
      <button class="mini" id="btnPage" title="New page">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4">
          <path d="M9 1.8H4.2A1.2 1.2 0 0 0 3 3v10a1.2 1.2 0 0 0 1.2 1.2h7.6A1.2 1.2 0 0 0 13 13V5.8z"/><path d="M9 1.8V5.8H13"/>
        </svg>
      </button>
      <button class="mini" id="btnFolder" title="New folder">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4">
          <path d="M1.8 4.2c0-.66.54-1.2 1.2-1.2h3l1.5 1.8h5.7c.66 0 1.2.54 1.2 1.2V12a1.2 1.2 0 0 1-1.2 1.2H3A1.2 1.2 0 0 1 1.8 12z"/>
        </svg>
      </button>
    </div>
    <div class="tree" id="tree"></div>
    <div class="nav-foot"><span id="stats"></span><span>Ctrl+E edit</span></div>
  </aside>
  <div class="grip" id="grip"></div>

  <section id="content">
    <div class="empty" id="empty">
      <h2>Nothing open</h2>
      <div>Create a page in the sidebar, or import a backup.</div>
      <button class="btn primary" id="btnFirst">Create a page</button>
    </div>

    <div id="doc" style="display:none;flex:1;min-height:0;flex-direction:column">
      <div class="doc-bar">
        <span class="crumbs" id="crumbs"></span>
        <input id="docTitle" spellcheck="false">
        <span class="status" id="status"></span>
        <div class="sep"></div>
        <button class="btn ghost" id="btnSource" title="Edit raw HTML">HTML</button>
        <button class="btn" id="btnMode">Edit</button>
      </div>

      <div class="toolbar" id="toolbar" style="display:none">
        <button data-cmd="formatBlock" data-val="h2" title="Heading">H2</button>
        <button data-cmd="formatBlock" data-val="h3" title="Subheading">H3</button>
        <button data-cmd="formatBlock" data-val="p" title="Paragraph">P</button>
        <div class="tb-sep"></div>
        <button data-cmd="bold" title="Bold  (Ctrl+B)"><b>B</b></button>
        <button data-cmd="italic" title="Italic  (Ctrl+I)"><i>I</i></button>
        <button data-cmd="underline" title="Underline"><u>U</u></button>
        <button data-cmd="strikeThrough" title="Strikethrough"><s>S</s></button>
        <div class="tb-sep"></div>
        <button data-cmd="insertUnorderedList" title="Bullet list">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4">
            <circle cx="3" cy="4" r="1"/><circle cx="3" cy="8" r="1"/><circle cx="3" cy="12" r="1"/>
            <line x1="6.5" y1="4" x2="14" y2="4"/><line x1="6.5" y1="8" x2="14" y2="8"/><line x1="6.5" y1="12" x2="14" y2="12"/>
          </svg>
        </button>
        <button data-cmd="insertOrderedList" title="Numbered list">1.</button>
        <button data-cmd="formatBlock" data-val="blockquote" title="Quote">&ldquo;</button>
        <div class="tb-sep"></div>
        <button id="tbBlock" title="Insert code block">Code block</button>
        <button id="tbImage" title="Paste the image on the clipboard (e.g. a screenshot) into the page">Image</button>
        <div class="tb-sep"></div>
        <button id="tbLink" title="Link">Link</button>
        <button id="tbTable" title="Insert table">Table</button>
        <button data-cmd="insertHorizontalRule" title="Divider">&#8212;</button>
        <span class="tb-hint">Ctrl+S saves &amp; closes editing</span>
      </div>

      <div class="scroll" id="scroll">
        <div class="page" id="page">
          <div class="body" id="viewer"></div>
          <div class="body" id="editor" contenteditable="true" spellcheck="false" style="display:none"></div>
          <div id="blocks"></div>
          <div class="tbl" id="tbl" style="display:none">
            <button data-t="rowAbove" title="Insert row above">+ Row &#8593;</button>
            <button data-t="rowBelow" title="Insert row below">+ Row &#8595;</button>
            <button data-t="delRow" title="Delete this row">&#8722; Row</button>
            <span class="sep"></span>
            <button data-t="colLeft" title="Insert column left">+ Col &#8592;</button>
            <button data-t="colRight" title="Insert column right">+ Col &#8594;</button>
            <button data-t="delCol" title="Delete this column">&#8722; Col</button>
            <span class="sep"></span>
            <button data-t="delTable" class="x" title="Delete this table">
              <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M3 4.4h10M6.4 4.4V3.1h3.2v1.3M4.4 4.4l.6 8.5h6l.6-8.5"/></svg>
            </button>
          </div>
        </div>
        <textarea id="source" spellcheck="false" style="display:none"></textarea>
      </div>
    </div>
  </section>
</main>

<div class="menu" id="menu"></div>
<div class="veil" id="veil"><div class="dialog" id="dialog"></div></div>
<div id="toast"></div>

<script>
"use strict";
/* ═══════════════════════════ state ═══════════════════════════ */
const KEY = "virtualpc.data.v1";
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);

let db = { tree: [], selected: null, navWidth: 270, navOpen: true };
let mode = "view";          // view | edit | source
let raw = "";               // current page HTML (single source of truth while editing)
let memoryOnly = false;     // set when localStorage is unavailable

const $ = id => document.getElementById(id);
const treeEl=$("tree"), viewer=$("viewer"), editor=$("editor"), source=$("source"),
      docEl=$("doc"), emptyEl=$("empty"), titleEl=$("docTitle"), statusEl=$("status"),
      toolbar=$("toolbar"), menuEl=$("menu"), veil=$("veil"), dialog=$("dialog");

/* ═══════════════════════════ storage ═══════════════════════════ */
function load(){
  try{
    const s = localStorage.getItem(KEY);
    if(s){ Object.assign(db, JSON.parse(s)); return true; }
  }catch(e){ memoryOnly = true; }
  return false;
}
let saveTimer=null;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 250);
}
/* write now — the debounce can't fire once the page is unloading */
function flush(){
  clearTimeout(saveTimer); saveTimer = null;
  try{ localStorage.setItem(KEY, JSON.stringify(db)); }
  catch(e){ memoryOnly = true; }
}
function flag(text){
  statusEl.textContent = text; statusEl.classList.add("on");
  setTimeout(()=>{ statusEl.classList.remove("on"); statusEl.textContent = mode==="view" ? "" : "Editing"; }, 1200);
}
function toast(msg){
  const t=$("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),2200);
}

/* ═══════════════════════════ tree model ═══════════════════════════ */
function find(id, nodes = db.tree, parent = null){
  for(const n of nodes){
    if(n.id === id) return { node:n, parent, arr:nodes };
    if(n.children){ const r = find(id, n.children, n); if(r) return r; }
  }
  return null;
}
function each(fn, nodes = db.tree, depth = 0, chain = []){
  for(const n of nodes){
    fn(n, depth, chain);
    if(n.children) each(fn, n.children, depth+1, [...chain, n]);
  }
}
function contains(folder, node){
  if(!folder.children) return false;
  let hit=false; each(n=>{ if(n===node) hit=true; }, folder.children);
  return hit;
}
function chainOf(id){
  let out=null;
  each((n,d,chain)=>{ if(n.id===id) out=chain; });
  return out || [];
}
/* where a new node lands: inside the selected folder, or beside the selected page */
function target(){
  const sel = db.selected && find(db.selected);
  if(!sel) return db.tree;
  if(sel.node.type === "folder"){ sel.node.children = sel.node.children||[]; sel.node.open = true; return sel.node.children; }
  return sel.arr;
}
function addPage(){
  const arr = target();
  const n = { id:uid(), type:"page", name:"Untitled page", content:"<p><br></p>" };
  arr.push(n); db.selected = n.id; save(); renderTree(); open(n.id);
  titleEl.focus(); titleEl.select();
}
function addFolder(){
  const arr = target();
  const n = { id:uid(), type:"folder", name:"New folder", open:true, children:[] };
  arr.push(n); save(); renderTree(); renameInTree(n.id);
}
async function remove(id){
  const f = find(id); if(!f) return;
  /* a folder's dialog lists everything nested inside it, so nothing gets deleted unseen */
  let count = 0, rows = "";
  if(f.node.type==="folder") each((n, depth) => {
    count++;
    rows += `<div class="pick-row" style="padding-left:${6 + depth * 18}px">
      <span class="gl">${ICON[n.type]}</span><span class="label">${esc(n.name)}</span></div>`;
  }, f.node.children||[]);
  const ok = await confirmBox(
    "Delete " + (f.node.type==="folder" ? "folder" : "page") + "?",
    count ? `“${f.node.name}” and ${count} item${count>1?"s":""} inside it will be removed.`
          : `“${f.node.name}” will be removed.`, "Delete",
    count ? `<div class="pick-tree ro">${rows}</div>` : "");
  if(!ok) return;
  const gone = f.node.id===db.selected || (f.node.children && contains(f.node, find(db.selected)?.node||{}));
  f.arr.splice(f.arr.indexOf(f.node), 1);
  if(gone || !find(db.selected)) { db.selected = null; }
  save(); renderTree(); render();
  toast("Deleted");
}
function move(dragId, dropId, where){
  if(dragId === dropId) return;
  const d = find(dragId), t = find(dropId);
  if(!d || !t) return;
  if(d.node.type==="folder" && contains(d.node, t.node)) return;   // no cycles
  d.arr.splice(d.arr.indexOf(d.node), 1);
  if(where === "into"){
    t.node.children = t.node.children || [];
    t.node.children.push(d.node); t.node.open = true;
  }else{
    const i = t.arr.indexOf(t.node);
    t.arr.splice(where === "before" ? i : i+1, 0, d.node);
  }
  save(); renderTree();
}

/* ═══════════════════════════ tree view ═══════════════════════════ */
const ICON = {
  folder:'<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M1.8 4.2c0-.66.54-1.2 1.2-1.2h3l1.5 1.8h5.7c.66 0 1.2.54 1.2 1.2V12a1.2 1.2 0 0 1-1.2 1.2H3A1.2 1.2 0 0 1 1.8 12z"/></svg>',
  page:'<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M9 1.8H4.2A1.2 1.2 0 0 0 3 3v10a1.2 1.2 0 0 0 1.2 1.2h7.6A1.2 1.2 0 0 0 13 13V5.8z"/><path d="M9 1.8V5.8H13"/></svg>',
  tw:'<svg width="10" height="10" viewBox="0 0 10 10" fill="currentColor"><path d="M3 1.5 7 5 3 8.5z"/></svg>'
};
let filter = "";
function matches(){
  if(!filter) return null;
  const q = filter.toLowerCase(), keep = new Set();
  const rec = (nodes, chain) => {
    for(const n of nodes){
      const hay = n.name.toLowerCase() + " " + (n.type==="page" ? (n.content||"").replace(/<[^>]*>/g," ").toLowerCase() : "");
      if(hay.includes(q)){ keep.add(n.id); chain.forEach(id => keep.add(id)); }
      if(n.children) rec(n.children, [...chain, n.id]);
    }
  };
  rec(db.tree, []);
  return keep;
}
function renderTree(){
  const keep = matches();
  treeEl.innerHTML = "";
  if(!db.tree.length){
    treeEl.innerHTML = '<div class="nav-empty">No pages yet.<br>Use the buttons above to add a page or a folder.</div>';
  }else{
    treeEl.appendChild(build(db.tree, keep));
    if(keep && !treeEl.querySelector(".row"))
      treeEl.innerHTML = '<div class="nav-empty">Nothing matches “'+esc(filter)+'”.</div>';
  }
  let pages=0, folders=0;
  each(n => n.type==="page" ? pages++ : folders++);
  $("stats").textContent = `${pages} page${pages!==1?"s":""} · ${folders} folder${folders!==1?"s":""}`;
}
function build(nodes, keep){
  const frag = document.createDocumentFragment();
  for(const n of nodes){
    if(keep && !keep.has(n.id)) continue;
    const wrap = document.createElement("div");
    const row = document.createElement("div");
    row.className = "row" + (n.id === db.selected ? " active" : "");
    row.dataset.id = n.id; row.draggable = true;
    const open = keep ? true : !!n.open;
    row.innerHTML =
      `<span class="tw ${n.type==="folder" ? (open?"open":"") : "leaf"}">${ICON.tw}</span>` +
      `<span class="gl">${ICON[n.type]}</span>` +
      `<span class="label">${esc(n.name)}</span>`;
    wire(row, n);
    wrap.appendChild(row);
    if(n.type === "folder" && open && n.children && n.children.length){
      const kids = document.createElement("div");
      kids.className = "children";
      kids.appendChild(build(n.children, keep));
      wrap.appendChild(kids);
    }
    frag.appendChild(wrap);
  }
  return frag;
}
function wire(row, n){
  row.addEventListener("click", e => {
    if(e.target.closest(".tw") && n.type === "folder"){ n.open = !n.open; save(); renderTree(); return; }
    if(n.type === "folder"){ n.open = !n.open; db.selected = n.id; save(); renderTree(); return; }
    db.selected = n.id; save(); renderTree(); open(n.id);
  });
  row.addEventListener("dblclick", e => { if(!e.target.closest(".tw")) renameInTree(n.id); });
  row.addEventListener("contextmenu", e => { e.preventDefault(); openMenu(e.clientX, e.clientY, n); });

  row.addEventListener("dragstart", e => {
    e.dataTransfer.setData("text/plain", n.id);
    e.dataTransfer.effectAllowed = "move";
    row.classList.add("dragging");
  });
  row.addEventListener("dragend", () => { row.classList.remove("dragging"); clearDrop(); });
  row.addEventListener("dragover", e => {
    e.preventDefault(); e.stopPropagation(); clearDrop();
    const r = row.getBoundingClientRect(), y = (e.clientY - r.top) / r.height;
    const where = n.type === "folder"
      ? (y < .25 ? "before" : y > .75 ? "after" : "into")
      : (y < .5 ? "before" : "after");
    row.classList.add(where === "into" ? "into" : where);
    row.dataset.where = where;
  });
  row.addEventListener("drop", e => {
    e.preventDefault(); e.stopPropagation();
    const id = e.dataTransfer.getData("text/plain");
    const where = row.dataset.where || "after";
    clearDrop(); if(id) move(id, n.id, where);
  });
}
/* a click in the blank part of the tree drops the highlight, so new items land at the root */
treeEl.addEventListener("click", e => {
  if(e.target.closest(".row") || db.selected == null) return;
  db.selected = null; save(); renderTree();
});
function clearDrop(){
  treeEl.querySelectorAll(".into,.before,.after").forEach(r => r.classList.remove("into","before","after"));
  treeEl.classList.remove("rootdrop");
}
treeEl.addEventListener("dragover", e => { e.preventDefault(); clearDrop(); treeEl.classList.add("rootdrop"); });
treeEl.addEventListener("drop", e => {
  e.preventDefault();
  const id = e.dataTransfer.getData("text/plain"); clearDrop();
  if(!id) return;
  const d = find(id); if(!d) return;
  d.arr.splice(d.arr.indexOf(d.node), 1);
  db.tree.push(d.node); save(); renderTree();
});
function renameInTree(id){
  renderTree();
  const row = treeEl.querySelector(`.row[data-id="${id}"]`); if(!row) return;
  const label = row.querySelector(".label");
  const node = find(id).node;
  label.contentEditable = "true"; label.focus();
  document.execCommand("selectAll", false, null);
  const done = ok => {
    label.contentEditable = "false";
    if(ok){
      const v = label.textContent.trim();
      if(v){ node.name = v; save(); if(node.id === db.selected) titleEl.value = v, crumbs(); }
    }
    renderTree();
  };
  label.addEventListener("blur", () => done(true), { once:true });
  label.addEventListener("keydown", e => {
    if(e.key === "Enter"){ e.preventDefault(); label.blur(); }
    if(e.key === "Escape"){ e.preventDefault(); label.textContent = node.name; label.blur(); }
  });
}

/* ═══════════════════════════ context menu ═══════════════════════════ */
function openMenu(x, y, n){
  db.selected = n.id; save(); renderTree();
  if(n.type === "page" && n.id !== openId && mode === "view") open(n.id);   // keep the panel in step with the highlight
  const items = [];
  if(n.type === "folder"){
    items.push(["New page here", () => addPage()], ["New folder here", () => addFolder()], ["-"]);
  }
  items.push(["Rename", () => renameInTree(n.id)]);
  if(n.type === "page") items.push(["Duplicate", () => duplicate(n.id)]);
  items.push(["-"], ["Delete", () => remove(n.id), true]);
  menuEl.innerHTML = "";
  for(const it of items){
    if(it[0] === "-"){ menuEl.insertAdjacentHTML("beforeend", '<div class="div"></div>'); continue; }
    const b = document.createElement("button");
    b.textContent = it[0]; if(it[2]) b.className = "danger";
    b.onclick = () => { closeMenu(); it[1](); };
    menuEl.appendChild(b);
  }
  menuEl.classList.add("open");
  const r = menuEl.getBoundingClientRect();
  menuEl.style.left = Math.min(x, innerWidth - r.width - 8) + "px";
  menuEl.style.top  = Math.min(y, innerHeight - r.height - 8) + "px";
}
function closeMenu(){ menuEl.classList.remove("open"); }
addEventListener("mousedown", e => { if(!menuEl.contains(e.target)) closeMenu(); });
addEventListener("blur", closeMenu);
function duplicate(id){
  const f = find(id); if(!f) return;
  const copy = JSON.parse(JSON.stringify(f.node));
  const stamp = o => { o.id = uid(); (o.children||[]).forEach(stamp); };
  stamp(copy); copy.name += " copy";
  f.arr.splice(f.arr.indexOf(f.node)+1, 0, copy);
  db.selected = copy.id; save(); renderTree(); open(copy.id);
}

/* ═══════════════════════════ sanitizing ═══════════════════════════ */
const OK_TAGS = new Set(["P","DIV","SPAN","BR","HR","H1","H2","H3","H4","H5","H6","UL","OL","LI","STRONG","B","EM","I","U","S","STRIKE","CODE","PRE","BLOCKQUOTE","A","TABLE","THEAD","TBODY","TR","TH","TD","IMG","SUB","SUP","FONT"]);
const OK_ATTR = new Set(["href","title","alt","src","colspan","rowspan","data-lang"]);
/* elements whose content is code/markup rather than text: removed together with their content */
const DROP_TAGS = new Set(["SCRIPT","STYLE","TEMPLATE","NOSCRIPT","IFRAME","OBJECT","EMBED","SVG","MATH","HEAD","META","LINK","TITLE"]);
/* links may be scheme-less (relative, #anchor) or http(s) / mailto — never javascript:, data:, vbscript: … */
function okHref(v){
  const m = /^\s*([a-z][a-z0-9+.\-]*):/i.exec(v.replace(/[\t\n\r]/g, ""));   // browsers ignore tabs/newlines in URLs
  return !m || /^(https?|mailto)$/i.test(m[1]);
}
function clean(html){
  const doc = new DOMParser().parseFromString("<div id='r'>" + html + "</div>", "text/html");
  const root = doc.getElementById("r");
  const unwrap = el => { walk(el); el.replaceWith(...el.childNodes); };
  const walk = el => {
    [...el.childNodes].forEach(c => { if(c.nodeType === 8) c.remove(); });   // comments (<!--StartFragment-->)
    [...el.children].forEach(child => {
      if(DROP_TAGS.has(child.tagName)){ child.remove(); return; }
      /* unknown wrappers (section, article, font-weight:normal <b> from Google Docs …) keep their content */
      if(!OK_TAGS.has(child.tagName) ||
         (/^(B|STRONG)$/.test(child.tagName) && /font-weight\s*:\s*(normal|[1-4]00)\b/i.test(child.getAttribute("style") || ""))){
        unwrap(child); return;
      }
      [...child.attributes].forEach(a => {
        const n = a.name.toLowerCase();
        if(n === "class"){ if(child.tagName === "PRE") child.setAttribute("class","code"); else child.removeAttribute("class"); return; }
        if(!OK_ATTR.has(n)) child.removeAttribute(a.name);
        else if(n === "href" && !okHref(a.value)) child.removeAttribute("href");
        else if(n === "src" && !/^(https?:|data:image\/)/i.test(a.value)) child.removeAttribute("src");
      });
      if(child.tagName === "PRE"){ child.className = "code"; if(!LANGS[child.dataset.lang]) child.dataset.lang = "plain"; }
      walk(child);
    });
  };
  walk(root);
  return root.innerHTML;
}
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
/* for text placed inside a double-quoted attribute (value="…", href="…") */
function attr(s){ return esc(s).replace(/"/g,"&quot;"); }

/* ═══════════════════════════ syntax highlighting ═══════════════════════════ */
const LANGS = {
  plain:      { label:"Plain text" },
  csharp:     { label:"C#", re:/(?<comment>\/\/[^\n]*|\/\*[\s\S]*?\*\/)|(?<string>@?"(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')|(?<number>\b\d[\d_]*(?:\.\d+)?[fFdDmMuUlL]?\b)|(?<keyword>\b(?:abstract|as|async|await|base|bool|break|byte|case|catch|char|checked|class|const|continue|decimal|default|delegate|do|double|else|enum|event|explicit|extern|false|finally|fixed|float|for|foreach|get|goto|if|implicit|in|init|int|interface|internal|is|lock|long|nameof|namespace|new|null|object|operator|out|override|params|partial|private|protected|public|readonly|record|ref|return|sbyte|sealed|set|short|sizeof|stackalloc|static|string|struct|switch|this|throw|true|try|typeof|uint|ulong|unchecked|unsafe|ushort|using|value|var|virtual|void|volatile|when|where|while|yield)\b)|(?<type>\b[A-Z][A-Za-z0-9_]*\b)|(?<fn>\b[a-z_]\w*(?=\())/g },
  sql:        { label:"SQL", re:/(?<comment>--[^\n]*|\/\*[\s\S]*?\*\/)|(?<string>'(?:[^']|'')*')|(?<number>\b\d+(?:\.\d+)?\b)|(?<keyword>\b(?:add|all|alter|and|any|as|asc|begin|between|by|case|cast|check|column|commit|constraint|create|cross|declare|default|delete|desc|distinct|drop|else|end|exec|execute|exists|foreign|from|full|group|having|identity|if|in|index|inner|insert|into|is|join|key|left|like|limit|merge|not|null|nvarchar|on|or|order|outer|over|partition|primary|procedure|references|return|right|rollback|rownum|select|set|table|then|top|transaction|truncate|union|unique|update|values|varchar|view|when|where|while|with)\b)|(?<fn>\b(?:avg|coalesce|concat|count|dateadd|datediff|getdate|isnull|len|lower|max|min|row_number|substring|sum|upper)\b)/gi },
  javascript: { label:"JavaScript", re:/(?<comment>\/\/[^\n]*|\/\*[\s\S]*?\*\/)|(?<string>"(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*'|`(?:[^`\\]|\\.)*`)|(?<number>\b\d[\d_]*(?:\.\d+)?\b)|(?<keyword>\b(?:async|await|break|case|catch|class|const|continue|default|delete|do|else|export|extends|false|finally|for|from|function|if|import|in|instanceof|let|new|null|of|return|static|super|switch|this|throw|true|try|typeof|undefined|var|void|while|yield)\b)|(?<type>\b[A-Z][A-Za-z0-9_]*\b)|(?<fn>\b[a-z_$]\w*(?=\())/g },
  json:       { label:"JSON", re:/(?<attr>"(?:[^"\\]|\\.)*"(?=\s*:))|(?<string>"(?:[^"\\]|\\.)*")|(?<number>-?\b\d+(?:\.\d+)?(?:e[+-]?\d+)?\b)|(?<keyword>\b(?:true|false|null)\b)/gi },
  html:       { label:"HTML", re:/(?<comment>&lt;!--[\s\S]*?--&gt;)|(?<tag>&lt;\/?[A-Za-z][\w-]*)|(?<string>"[^"]*"|'[^']*')|(?<attr>[A-Za-z-]+(?==))/g },
  css:        { label:"CSS", re:/(?<comment>\/\*[\s\S]*?\*\/)|(?<string>"[^"]*"|'[^']*')|(?<number>-?\b\d+(?:\.\d+)?(?:px|em|rem|%|vh|vw|s|ms)?\b|#[0-9a-fA-F]{3,8})|(?<attr>[a-z-]+(?=\s*:))|(?<keyword>@[a-z-]+|![a-z]+)/g },
  python:     { label:"Python", re:/(?<comment>#[^\n]*)|(?<string>"""[\s\S]*?"""|'''[\s\S]*?'''|"(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')|(?<number>\b\d[\d_]*(?:\.\d+)?\b)|(?<keyword>\b(?:and|as|assert|async|await|break|class|continue|def|del|elif|else|except|False|finally|for|from|global|if|import|in|is|lambda|None|nonlocal|not|or|pass|raise|return|True|try|while|with|yield|self)\b)|(?<fn>\b[a-z_]\w*(?=\())/g },
  bash:       { label:"Shell", re:/(?<comment>#[^\n]*)|(?<string>"(?:[^"\\]|\\.)*"|'[^']*')|(?<keyword>\b(?:case|cd|do|done|echo|elif|else|esac|exit|export|fi|for|function|if|in|local|return|then|while)\b|\$\w+|\$\{[^}]*\})|(?<number>\b\d+\b)/g }
};
function highlight(code, lang){
  const t = esc(code);
  const def = LANGS[lang];
  if(!def || !def.re) return t;
  def.re.lastIndex = 0;
  return t.replace(def.re, (...a) => {
    const g = a[a.length - 1];
    for(const k in g) if(g[k] !== undefined) return `<span class="t-${k}">${g[k]}</span>`;
    return a[0];
  });
}

/* ═══════════════════════════ code formatting ═══════════════════════════ */
/* Every language gets a fmt(code) → string, run by the Format button in the block header
   while editing. They are small pretty-printers, not parsers: strings and comments are
   copied through, the rest is re-broken into lines and re-indented. Throw to refuse. */
const SP = n => " ".repeat(n);
const lf = s => s.replace(/\r\n?/g, "\n");
/* joins finished lines: at most one blank line in a row, none at the end */
const joinLines = lines => lines.join("\n").replace(/\n{3,}/g, "\n\n").replace(/^\n+|\s+$/g, "");

/* C-like syntaxes (C#, JavaScript, CSS): `{` `;` end a line, `}` starts one, indentation
   follows the unclosed brackets. Inside ( ) and [ ] nothing is re-broken, so calls, `for(;;)`
   heads and object/array literals passed as arguments keep their shape. */
function fmtClike(code, unit, lineComment){
  code = lf(code);
  const n = code.length, lines = [];
  let cur = "", depth = 0, start = 0, inl = 0, i = 0;
  const flush = () => {
    const t = cur.trim(); cur = "";
    if(t){ let ind = start; if(/^[}\])]/.test(t)) ind = Math.max(0, ind - 1); lines.push(SP(ind * unit) + t); }
    else lines.push("");
    start = depth;
  };
  /* end the line here unless the source already does */
  const nl = () => { while(code[i] === " " || code[i] === "\t") i++; if(code[i] !== "\n") flush(); };
  while(i < n){
    const c = code[i], d = code[i + 1];
    if(c === "\n"){ flush(); i++; continue; }
    if(lineComment && code.startsWith(lineComment, i)){ let j = code.indexOf("\n", i); if(j < 0) j = n; cur += code.slice(i, j); i = j; continue; }
    if(c === "/" && d === "*"){ let j = code.indexOf("*/", i + 2); j = j < 0 ? n : j + 2; cur += code.slice(i, j); i = j; continue; }

/* SQL: keywords upper-cased, one clause per line, AND/OR indented under their clause,

  const add = (t, tight) => {
    if(comment) nl(ind);
    if(pend && !tight && line && !/\s$/.test(line)) line += " ";
    line += t; pend = false;
  };
  for(const m of lf(code).matchAll(/--[^\n]*|\/\*[\s\S]*?\*\/|'(?:[^']|'')*'|"[^"]*"|\[[^\]]*\]|\s+|[A-Za-z_]\w*|./g)){
    const t = m[0];
    if(/^\s+$/.test(t)){ pend = true; continue; }
    if(t.startsWith("--")){ add(t); comment = true; continue; }
    if(t === "("){ add("("); paren.push({ ind, own:false }); pend = false; continue; }
    if(t === ")"){ const p = paren.length > 1 ? paren.pop() : paren[0]; if(p.own && p.ind >= 0) nl(p.ind); add(")", true); continue; }
    if(t === ","){ add(",", true); continue; }
    if(t === ";"){ add(";", true); nl(0); lines.push(""); prev = ""; continue; }
    if(/^[A-Za-z_]/.test(t)){

/* HTML: one block tag per line, children indented; text and inline tags (<b>, <a> …) share a

  const flush = () => { const t = text.replace(/\s+/g, " ").trim(); if(t) push(t); text = ""; };
  while(i < n){
    if(code[i] !== "<"){ let j = code.indexOf("<", i); if(j < 0) j = n; text += code.slice(i, j); i = j; continue; }
    if(code.startsWith("<!--", i)){ flush(); let j = code.indexOf("-->", i); j = j < 0 ? n : j + 3; push(code.slice(i, j).trim()); i = j; continue; }
    let j = code.indexOf(">", i); j = j < 0 ? n : j + 1;
    const tag = code.slice(i, j), m = /^<(\/?)([A-Za-z!][\w-]*)/.exec(tag);

    const name = m[2].toLowerCase();
    if(INLINE_TAGS.test(name)){ text += tag; i = j; continue; }
    flush();
    if(m[1]){ ind = Math.max(0, ind - 1); push(tag); i = j; continue; }

/* db.selected is the highlighted row (may be a folder); openId is the page shown in

  const f = find(id); if(!f || f.node.type !== "page") return;

       (db.selected already points at the new one, so commit() can't be used) */
    clearTimeout(typeTimer);

/* view-mode chrome for code blocks: a bar with a collapse toggle, the language, the line

const CHEV = '<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3.5 6 8 10.5 12.5 6"/></svg>';
function decorate(root){
  root.querySelectorAll("pre.code").forEach(pre => {
    const lang = pre.dataset.lang || "plain";

    const wrap = document.createElement("div");
    wrap.className = "code-wrap collapsed";
    const bar = document.createElement("div");
    bar.className = "code-bar";
    const n = code.replace(/\n$/, "").split("\n").length;
    bar.innerHTML = `<button class="tog" aria-expanded="false" title="Expand">${CHEV}</button>` +
                    `<span>${esc((LANGS[lang]||{}).label || lang)}</span><span class="n">${n} line${n !== 1 ? "s" : ""}</span>`;
    bar.querySelector(".tog").onclick = e => {
      const open = wrap.classList.toggle("collapsed") === false;

function splitQuote(q){
  const s = getSelection(), r = s.getRangeAt(0);
  r.deleteContents();
  const rest = document.createRange();
  rest.setStart(r.startContainer, r.startOffset); rest.setEnd(q, q.childNodes.length);
  const p = document.createElement("p");
  p.appendChild(rest.extractContents());
  if(!p.textContent && !p.querySelector("br")) p.innerHTML = "<br>";
  if(!q.textContent && !q.querySelector("br")) q.innerHTML = "<br>";
  q.after(p);
  caretTo(p, false);
}
/* the <blockquote> whose first character the collapsed caret sits before, else null */
function quoteStart(){
  const s = getSelection();
  if(!s.rangeCount || !s.isCollapsed) return null;
  const r = s.getRangeAt(0);
  let n = r.startContainer;
  const q = (n.nodeType === 3 ? n.parentNode : n).closest("blockquote");
  if(!q || !editor.contains(q)) return null;
  const probe = document.createRange();
  probe.setStart(q, 0); probe.setEnd(r.startContainer, r.startOffset);
  return probe.toString() === "" ? q : null;
}
/* replace the quote by its blocks (loose inline content is wrapped in a <p>) and put the caret at the start */
function unquote(q){
  const frag = document.createDocumentFragment();
  let p = null;
  while(q.firstChild){
    const c = q.firstChild;
    if(c.nodeType === 1 && /^(P|H[1-6]|UL|OL|PRE|TABLE|HR|BLOCKQUOTE|DIV)$/.test(c.tagName)){ p = null; frag.appendChild(c); continue; }
    if(!p){ p = document.createElement("p"); frag.appendChild(p); }
    p.appendChild(c);
  }
  if(!frag.firstChild){ p = document.createElement("p"); p.innerHTML = "<br>"; frag.appendChild(p); }
  const first = frag.firstChild;
  q.replaceWith(frag);
  caretTo(first, false);
}

/* ═══════════════════════════ code block headers ═══════════════════════════ */
const layer = $("blocks");
const LANG_OPTS = Object.entries(LANGS).map(([k, v]) => `<option value="${k}">${v.label}</option>`).join("");
const TRASH = '<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M3 4.4h10M6.4 4.4V3.1h3.2v1.3M4.4 4.4l.6 8.5h6l.6-8.5"/></svg>';

function makeHead(){
  const h = document.createElement("div");
  h.className = "blk";
  h.innerHTML = `<select title="Code language">${LANG_OPTS}</select><span class="grow"></span>` +
                `<button class="fmt" title="Re-indent the code for its language">Format</button>` +
                `<button class="x" title="Delete this code block">${TRASH}</button>`;
  h.querySelector("select").onchange = e => {
    if(!h._pre) return;
    h._pre.dataset.lang = e.target.value;
    raw = editor.innerHTML; commit();
  };
  h.querySelector(".fmt").onmousedown = e => e.preventDefault();   // keep the editor focused
  h.querySelector(".fmt").onclick = () => {
    const pre = h._pre; if(!pre) return;
    const def = LANGS[pre.dataset.lang] || LANGS.plain;
    const was = preText(pre);
    let out;
    try{ out = def.fmt(was).replace(/\s+$/, "") + "\n"; }
    catch(e){ toast("Can't format: " + e.message); return; }
    if(out === was){ toast("Already formatted"); return; }
    pre.textContent = out;
    raw = editor.innerHTML; commit();
    editor.focus(); caretTo(pre);
  };
  h.querySelector(".x").onclick = async () => {
    if(!h._pre) return;
    const ok = await confirmBox("Delete code block?", "The code inside it will be removed from this page.", "Delete");
    if(!ok || !h._pre) return;
    h._pre.remove();
    raw = editor.innerHTML; commit(); syncBlocks(); editor.focus();
  };
  return h;
}
let syncQueued = false;
function scheduleSync(){
  if(syncQueued) return;
  syncQueued = true;
  requestAnimationFrame(() => { syncQueued = false; syncBlocks(); });
}
function syncBlocks(){
  if(mode !== "edit"){ layer.innerHTML = ""; syncTable(); return; }
  const pres = [...editor.querySelectorAll("pre.code")];
  while(layer.children.length > pres.length) layer.lastChild.remove();
  while(layer.children.length < pres.length) layer.appendChild(makeHead());
  const base = $("page").getBoundingClientRect();
  pres.forEach((pre, i) => {
    if(!LANGS[pre.dataset.lang]) pre.dataset.lang = "plain";
    const h = layer.children[i], r = pre.getBoundingClientRect();
    h._pre = pre;
    h.style.left  = (r.left - base.left + 2) + "px";
    h.style.top   = (r.top  - base.top  + 1) + "px";
    h.style.width = (r.width - 3) + "px";
    const sel = h.querySelector("select");
    if(document.activeElement !== sel) sel.value = pre.dataset.lang;
  });
  syncTable();
}
new MutationObserver(scheduleSync).observe(editor, { childList:true, subtree:true, characterData:true, attributes:true });
addEventListener("resize", scheduleSync);

/* ═══════════════════════════ table tools ═══════════════════════════ */
/* a bar with row/column buttons floats above the table the caret is in.
   Cells are addressed by position (cellIndex) — colspan/rowspan are not expanded. */
const tbl = $("tbl");
function currentCell(){
  const s = getSelection();
  if(!s.rangeCount) return null;
  let n = s.getRangeAt(0).startContainer;
  n = n.nodeType === 3 ? n.parentNode : n;
  const cell = n && n.closest ? n.closest("td,th") : null;
  return cell && editor.contains(cell) ? cell : null;
}
function blankCell(tag){ const c = document.createElement(tag); c.innerHTML = "<br>"; return c; }
/* every op takes the current cell, mutates the table and returns the cell to put the caret in */
/* a header is a <thead> row, or a first row made of <th> */
function isHeader(tr){ return tr.parentNode.tagName === "THEAD" || (tr.rowIndex === 0 && !!tr.cells[0] && tr.cells[0].tagName === "TH"); }
/* rows are never added to the header: from a header cell the new row becomes the first body row */
function addRow(cell, below){
  const tr = cell.parentNode, table = tr.closest("table"), header = isHeader(tr);
  const nr = document.createElement("tr");
  [...tr.cells].forEach(c => nr.appendChild(blankCell(header ? "td" : c.tagName)));
  if(!header) tr.parentNode.insertBefore(nr, below ? tr.nextSibling : tr);
  else{
    const first = [...table.rows].find(r => !isHeader(r));
    if(first) first.parentNode.insertBefore(nr, first);
    else (table.tBodies[0] || table.appendChild(document.createElement("tbody"))).appendChild(nr);
  }
  return nr.cells[cell.cellIndex];
}
function addCol(cell, after){
  const i = cell.cellIndex;
  let focus = null;
  [...cell.closest("table").rows].forEach(row => {
    const ref = row.cells[i], c = blankCell((ref || row.cells[row.cells.length - 1] || cell).tagName);
    if(ref) ref.parentNode.insertBefore(c, after ? ref.nextSibling : ref); else row.appendChild(c);
    if(row === cell.parentNode) focus = c;
  });
  return focus;
}
function removeTable(table){
  const p = document.createElement("p"); p.innerHTML = "<br>";
  table.replaceWith(p);
  return p;
}
const TABLE_OPS = {
  rowAbove: cell => addRow(cell, false),
  rowBelow: cell => addRow(cell, true),
  colLeft:  cell => addCol(cell, false),
  colRight: cell => addCol(cell, true),
  delRow(cell){
    let tr = cell.parentNode; const table = tr.closest("table");
    if(isHeader(tr)){                          // the header stays; remove the first body row instead
      tr = [...table.rows].find(r => !isHeader(r));
      if(!tr){ toast("The header row stays — delete the table to remove it"); return cell; }
    }
    if(table.rows.length <= 1) return removeTable(table);
    const i = tr.rowIndex; tr.remove();
    const row = table.rows[Math.min(i, table.rows.length - 1)];
    return row.cells[Math.min(cell.cellIndex, row.cells.length - 1)];
  },
  delCol(cell){
    const tr = cell.parentNode, table = tr.closest("table"), i = cell.cellIndex;
    if(tr.cells.length <= 1) return removeTable(table);
    [...table.rows].forEach(row => row.cells[i] && row.cells[i].remove());
    return tr.cells[Math.min(i, tr.cells.length - 1)];
  },
  delTable: cell => removeTable(cell.closest("table"))
};
tbl.querySelectorAll("button").forEach(b => {
  b.onmousedown = e => e.preventDefault();
  b.onclick = async () => {
    const cell = tbl._cell;
    if(!cell || !cell.isConnected) return;
    if(b.dataset.t === "delTable"){
      const ok = await confirmBox("Delete table?", "Everything in it will be removed from this page.", "Delete");
      if(!ok || !cell.isConnected) return;
    }
    const focus = TABLE_OPS[b.dataset.t](cell);
    editor.focus(); caretTo(focus, false);
    raw = editor.innerHTML; commit(); syncBlocks();
  };
});
function syncTable(){
  const cell = mode === "edit" ? currentCell() : null;
  tbl._cell = cell;
  tbl.style.display = cell ? "" : "none";
  if(!cell) return;
  const base = $("page").getBoundingClientRect(), r = cell.closest("table").getBoundingClientRect();
  tbl.style.left = (r.left - base.left) + "px";
  tbl.style.top  = (r.top  - base.top - 36) + "px";
}
document.addEventListener("selectionchange", () => { if(mode === "edit") scheduleSync(); });
editor.addEventListener("click", scheduleSync);
editor.addEventListener("keyup", scheduleSync);

/* ═══════════════════════════ export / import ═══════════════════════════ */
$("btnExport").onclick = async () => {
  if(mode !== "view") commit();
  if(!db.tree.length){ toast("Nothing to export yet"); return; }
  const picked = await pickBox("Export", "Choose which folders and pages to include in the backup.", db.tree, "Export");
  if(!picked) return;
  const tree = prune(db.tree, picked);
  let count = 0; each(n => { if(n.type === "page") count++; }, tree);
  const payload = { app:"virtualpc", version:1, exportedAt:new Date().toISOString(), tree };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type:"application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "virtualpc-" + new Date().toISOString().slice(0, 10) + ".json";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast("Exported " + count + " page" + (count !== 1 ? "s" : ""));
};
$("btnImport").onclick = () => $("file").click();
$("file").onchange = async e => {
  const file = e.target.files[0]; e.target.value = "";
  if(!file) return;
  let data;
  try{ data = JSON.parse(await file.text()); }
  catch(err){ toast("That file isn't valid JSON"); return; }
  const tree = Array.isArray(data) ? data : data && data.tree;
  if(!Array.isArray(tree)){ toast("No Virtual PC data found in that file"); return; }
  const all = normalize(tree);
  if(!all.length){ toast("That backup is empty"); return; }
  const picked = await pickBox("Import", "Choose which folders and pages to bring in from " + file.name + ".", all, "Import");
  if(!picked) return;
  const nodes = prune(all, picked);
  let count = 0; each(() => count++, nodes);
  const choice = await choiceBox("Import " + count + " item" + (count > 1 ? "s" : ""),
    "Replace everything currently stored, or add the imported items alongside it?",
    [["Merge","merge"],["Replace","replace"]]);
  if(!choice) return;
  if(choice === "replace"){ db.tree = nodes; db.selected = null; }
  else db.tree = db.tree.concat(nodes);
  save(); renderTree(); render();
  toast(choice === "replace" ? "Library replaced" : "Items merged in");
};
/* deep-copy `nodes`, keeping pages whose id is in `keep` and folders that are
   kept themselves or hold something that is */
function prune(nodes, keep){
  const out = [];
  for(const n of nodes){
    if(n.type === "folder"){
      const children = prune(n.children || [], keep);
      if(keep.has(n.id) || children.length) out.push({ ...n, children });
    }else if(keep.has(n.id)) out.push({ ...n });
  }
  return out;
}
function normalize(arr){
  const out = [];
  for(const n of arr || []){
    if(!n || typeof n !== "object") continue;
    const type = n.type === "folder" || Array.isArray(n.children) ? "folder" : "page";
    const node = { id:uid(), type, name:String(n.name || (type === "folder" ? "Folder" : "Untitled page")).slice(0, 200) };
    if(type === "folder"){ node.open = n.open !== false; node.children = normalize(n.children); }
    else node.content = clean(String(n.content || ""));
    out.push(node);
  }
  return out;
}

/* ═══════════════════════════ dialogs ═══════════════════════════ */
function openDialog(html, focusSel){
  dialog.innerHTML = html; veil.classList.add("open");
  const f = focusSel && dialog.querySelector(focusSel);
  if(f){ f.focus(); f.select && f.select(); }
}
function closeDialog(){ veil.classList.remove("open"); dialog.classList.remove("wide"); dialog.innerHTML = ""; }
/* `extra` is trusted, already-escaped markup shown between the message and the buttons */
function confirmBox(title, msg, label = "OK", extra = ""){
  return new Promise(res => {
    openDialog(`<h3>${esc(title)}</h3><p>${esc(msg)}</p>${extra}<div class="acts">
      <button class="btn ghost" data-a="0">Cancel</button>
      <button class="btn ${label === "Delete" ? "danger" : "primary"}" data-a="1">${esc(label)}</button></div>`);
    dialog.querySelectorAll("[data-a]").forEach(b => b.onclick = () => { closeDialog(); res(b.dataset.a === "1"); });
    dialog.querySelector('[data-a="1"]').focus();
    veil._esc = () => { closeDialog(); res(false); };
  });
}
function promptBox(title, label, value = ""){
  return new Promise(res => {
    openDialog(`<h3>${esc(title)}</h3><p>${esc(label)}</p><input value="${attr(value)}">
      <div class="acts"><button class="btn ghost" data-a="0">Cancel</button>
      <button class="btn primary" data-a="1">Add</button></div>`, "input");
    const input = dialog.querySelector("input");
    const done = ok => { const v = input.value.trim(); closeDialog(); res(ok ? v : null); };
    dialog.querySelector('[data-a="1"]').onclick = () => done(true);
    dialog.querySelector('[data-a="0"]').onclick = () => done(false);
    input.onkeydown = e => { if(e.key === "Enter") done(true); };
    veil._esc = () => done(false);
  });
}
function linkBox(name = ""){
  return new Promise(res => {
    openDialog(`<h3>Add link</h3><p>Name</p><input id="lkName" value="${attr(name)}" placeholder="Link text">
      <p>Address</p><input id="lkUrl" value="https://">
      <div class="acts"><button class="btn ghost" data-a="0">Cancel</button>
      <button class="btn primary" data-a="1">Add</button></div>`, name ? "#lkUrl" : "#lkName");
    const nameIn = dialog.querySelector("#lkName"), urlIn = dialog.querySelector("#lkUrl");
    const done = ok => {
      const url = urlIn.value.trim(); closeDialog();
      res(ok && url && url !== "https://" ? { url, name:nameIn.value.trim() } : null);   // untouched placeholder = no link
    };
    dialog.querySelector('[data-a="1"]').onclick = () => done(true);
    dialog.querySelector('[data-a="0"]').onclick = () => done(false);
    nameIn.onkeydown = e => { if(e.key === "Enter"){ e.preventDefault(); urlIn.focus(); urlIn.select(); } };
    urlIn.onkeydown = e => { if(e.key === "Enter") done(true); };
    veil._esc = () => done(false);
  });
}
function choiceBox(title, msg, choices){
  return new Promise(res => {
    const btns = choices.map((c, i) =>
      `<button class="btn ${i === choices.length-1 ? "primary" : ""}" data-v="${c[1]}">${esc(c[0])}</button>`).join("");
    openDialog(`<h3>${esc(title)}</h3><p>${esc(msg)}</p><div class="acts">
      <button class="btn ghost" data-v="">Cancel</button>${btns}</div>`);
    dialog.querySelectorAll("[data-v]").forEach(b => b.onclick = () => { closeDialog(); res(b.dataset.v || null); });
    veil._esc = () => { closeDialog(); res(null); };
  });
}
/* tree of checkboxes; resolves with a Set of chosen ids, or null on cancel */
function pickBox(title, msg, nodes, label){
  return new Promise(res => {
    let rows = "";
    each((n, depth) => {
      rows += `<label class="pick-row" style="padding-left:${6 + depth * 18}px">
        <input type="checkbox" data-id="${n.id}" data-type="${n.type}" checked>
        <span class="gl">${ICON[n.type]}</span><span class="label">${esc(n.name)}</span></label>`;
    }, nodes);
    dialog.classList.add("wide");
    openDialog(`<h3>${esc(title)}</h3><p>${esc(msg)}</p>
      <div class="pick-head"><span id="pickCount"></span><span>
        <button class="btn ghost" data-sel="1">Select all</button>
        <button class="btn ghost" data-sel="0">Select none</button></span></div>
      <div class="pick-tree">${rows}</div>
      <div class="acts"><button class="btn ghost" data-a="0">Cancel</button>
      <button class="btn primary" data-a="1">${esc(label)}</button></div>`);
    const boxes = [...dialog.querySelectorAll(".pick-tree input")];
    const byId = new Map(boxes.map(b => [b.dataset.id, b]));
    const ok = dialog.querySelector('[data-a="1"]'), count = dialog.querySelector("#pickCount");
    const boxOf = n => byId.get(n.id);
    /* folders reflect their descendants: all → checked, some → indeterminate */
    function refresh(list = nodes){
      let checked = 0, total = 0;
      for(const n of list){
        const b = boxOf(n);
        if(n.type === "folder" && n.children && n.children.length){
          const [c, t] = refresh(n.children);
          b.checked = c === t; b.indeterminate = c > 0 && c < t;
          checked += c; total += t;
        }else{
          b.indeterminate = false;
          if(b.checked) checked++; total++;
        }
      }
      if(list === nodes){
        count.textContent = checked + " of " + total + " selected";
        ok.disabled = !checked;
      }
      return [checked, total];
    }
    const setAll = (list, v) => each(n => { boxOf(n).checked = v; }, list);
    boxes.forEach(b => b.onchange = () => {
      const n = find(b.dataset.id, nodes);
      if(n && n.node.type === "folder") setAll(n.node.children || [], b.checked);
      refresh();
    });
    dialog.querySelectorAll("[data-sel]").forEach(b => b.onclick = () => { setAll(nodes, b.dataset.sel === "1"); refresh(); });
    refresh();
    const done = go => {
      const set = new Set(boxes.filter(b => b.checked || b.indeterminate).map(b => b.dataset.id));
      closeDialog(); res(go && set.size ? set : null);
    };
    ok.onclick = () => done(true);
    dialog.querySelector('[data-a="0"]').onclick = () => done(false);
    veil._esc = () => done(false);
    ok.focus();
  });
}
veil.onmousedown = e => { if(e.target === veil && veil._esc) veil._esc(); };

/* ═══════════════════════════ sidebar width + shortcuts ═══════════════════════════ */
const grip = $("grip");
grip.addEventListener("mousedown", e => {
  e.preventDefault(); grip.classList.add("active");
  const startX = e.clientX, startW = db.navWidth;
  const mv = ev => {
    db.navWidth = Math.max(190, Math.min(520, startW + ev.clientX - startX));
    document.documentElement.style.setProperty("--sw", db.navWidth + "px");
    scheduleSync();
  };
  const up = () => { grip.classList.remove("active"); save();
    removeEventListener("mousemove", mv); removeEventListener("mouseup", up); };
  addEventListener("mousemove", mv); addEventListener("mouseup", up);
});
function toggleNav(){
  db.navOpen = !db.navOpen;
  document.body.classList.toggle("nav-closed", !db.navOpen);
  save(); scheduleSync();
}
$("btnNav").onclick = toggleNav;
$("search").addEventListener("input", e => { filter = e.target.value.trim(); renderTree(); });

addEventListener("keydown", e => {
  if(e.key === "Escape"){
    if(veil.classList.contains("open") && veil._esc) return veil._esc();
    if(menuEl.classList.contains("open")) return closeMenu();
    if(mode !== "view"){ commit(); setMode("view"); }
    return;
  }
  const mod = e.ctrlKey || e.metaKey;
  if(!mod) return;
  const k = e.key.toLowerCase();
  if(k === "s"){ e.preventDefault(); commit(); if(mode !== "view") setMode("view"); }
  else if(k === "e"){ e.preventDefault(); if(openPage()){ if(mode !== "view") commit(); setMode(mode === "view" ? "edit" : "view"); } }
  else if(k === "\\"){ e.preventDefault(); toggleNav(); }
  /* Ctrl+F is deliberately left alone: the browser's find-in-page searches the open page */
});
